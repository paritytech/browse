name: Bundle Size

on:
  push:
    branches: [main]
    paths: ['apps/registry/**', 'apps/widget/**', 'packages/**', 'scripts/bundle-size.ts', '.github/workflows/bundle-size.yml']
  pull_request:
    branches: [main]
    paths: ['apps/registry/**', 'apps/widget/**', 'packages/**', 'scripts/bundle-size.ts', '.github/workflows/bundle-size.yml']

concurrency:
  group: bundle-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml

  report:
    name: Report
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: apps/registry/dist/

      # Every run on main re-uploads the whole history, so the newest artifact
      # holds every snapshot. Absent until main has built once.
      - name: Download size history
        uses: dawidd6/action-download-artifact@v6
        with:
          name: bundle-size-history
          path: .bundle-size
          branch: main
          workflow: bundle-size.yml
          workflow_conclusion: success
          if_no_artifact_found: warn

      - name: Measure the pull request
        if: github.event_name == 'pull_request'
        run: >
          bun scripts/bundle-size.ts comment
          --dist=apps/registry/dist
          --history=.bundle-size/history.json
          --out=bundle-size-comment.md
          --sha=${{ github.event.pull_request.head.sha }}

      - name: Post the report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('bundle-size-comment.md', 'utf8')
            const marker = '<!-- bundle-size -->'

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find(c => c.body?.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }

      - name: Record the snapshot
        if: github.event_name == 'push'
        run: >
          bun scripts/bundle-size.ts record
          --dist=apps/registry/dist
          --history=.bundle-size/history.json

      - name: Upload size history
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size-history
          path: .bundle-size/history.json
          retention-days: 90
