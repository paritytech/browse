name: Snapshot Domains

on:
  schedule:
    # Daily at 03:17 UTC, off the top of the hour to dodge cron congestion.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot-domains-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot-domains:
    name: Publish ${{ matrix.network.name }} domains snapshot
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        network:
          - name: Paseo
            genesis: '0x23e730eb1c6fecae09c917439a5038cb6122d0d48980e8b9bbf0ff56f94a2ca6'
            cache-prefix: paseo-domains-snapshot-cid
          - name: Previewnet
            genesis: '0x627f54413120c81161261b2ca87f60f0020963107dc28367491e09ec2dd29659'
            cache-prefix: previewnet-domains-snapshot-cid
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Publish snapshot
        id: snapshot
        working-directory: app
        env:
          MNEMONIC: ${{ secrets.MNEMONIC }}
          NETWORK_GENESIS_HASH: ${{ matrix.network.genesis }}
        run: |
          # Capture the CID even on failure. The script prints it once the blocks
          # are stored, before the pointer write, so a failed record write must
          # still surrender a CID that is already published and paid for.
          # Without pipefail the exit code of tee would win and hide the failure.
          set -o pipefail
          status=0
          bun run snapshot:domains | tee snapshot.log || status=$?
          cid=$(grep -oE 'APP_DOMAINS_SNAPSHOT_CID=[A-Za-z0-9]+' snapshot.log | tail -1 | cut -d= -f2 || true)
          echo "cid=$cid" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Stage snapshot CID
        if: always() && steps.snapshot.outputs.cid != ''
        env:
          CID: ${{ steps.snapshot.outputs.cid }}
        run: |
          mkdir -p .snapshot-cid
          echo "$CID" > .snapshot-cid/cid

      - name: Cache snapshot CID
        if: always() && steps.snapshot.outputs.cid != ''
        uses: actions/cache/save@v4
        with:
          path: .snapshot-cid
          key: ${{ matrix.network.cache-prefix }}-${{ github.run_id }}

      - name: Snapshot summary
        env:
          CID: ${{ steps.snapshot.outputs.cid }}
          NETWORK: ${{ matrix.network.name }}
        run: |
          {
            echo "### ${NETWORK} domain snapshot"
            echo ""
            echo "Manifest CID &nbsp; \`${CID}\`"
            echo ""
            echo "Cached as \`APP_DOMAINS_SNAPSHOT_CID\` for the next build."
          } >> "$GITHUB_STEP_SUMMARY"
