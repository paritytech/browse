name: Build

on:
  workflow_call:
  push:
    branches: [main]
    paths: ['apps/registry/**', 'apps/widget/**', 'packages/**']
  pull_request:
    branches: [main]
    paths: ['apps/registry/**', 'apps/widget/**', 'packages/**']

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/registry
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The daily snapshot job stashes the latest manifest CID here. The prefix
      # match picks up its newest run. Absent on the first ever build.
      - name: Restore snapshot CID
        uses: actions/cache/restore@v4
        with:
          path: .snapshot-cid
          key: paseo-domains-snapshot-cid
          restore-keys: |
            paseo-domains-snapshot-cid-

      - name: Read snapshot CID
        id: snapshot-cid
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f .snapshot-cid/cid ]; then
            echo "cid=$(cat .snapshot-cid/cid)" >> "$GITHUB_OUTPUT"
          fi

      # Same for the daily username snapshot, cached independently.
      - name: Restore username snapshot CID
        uses: actions/cache/restore@v4
        with:
          path: .usernames-snapshot-cid
          key: paseo-usernames-snapshot-cid
          restore-keys: |
            paseo-usernames-snapshot-cid-

      - name: Read username snapshot CID
        id: usernames-cid
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f .usernames-snapshot-cid/cid ]; then
            echo "cid=$(cat .usernames-snapshot-cid/cid)" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache build output
        id: cache
        uses: actions/cache@v4
        with:
          path: apps/registry/dist
          key: build-${{ hashFiles('apps/registry/src/**', 'apps/registry/index.html', 'apps/registry/package.json', 'apps/registry/vite.config.ts', 'apps/registry/tsconfig.json', 'apps/widget/src/**', 'apps/widget/index.html', 'apps/widget/package.json', 'apps/widget/vite.config.ts', 'bun.lock', 'apps/registry/.papi/**') }}-${{ steps.snapshot-cid.outputs.cid }}-${{ steps.usernames-cid.outputs.cid }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          APP_DOMAINS_SNAPSHOT_CID: ${{ steps.snapshot-cid.outputs.cid }}
          APP_USERNAMES_SNAPSHOT_CID: ${{ steps.usernames-cid.outputs.cid }}
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: apps/registry/dist/
          retention-days: 7
